# v2 model configuration (FBS_RUN=v2). Identical to model.yaml (v1) except the `v2` section below.
seed: 20260928
labels:
  primary_quantile: 0.90          # project-defined bust criterion
  sensitivity_quantile: 0.95
  hidden_bust_spread_quantile: 0.25  # documented diagnostic, not a universal constant
  conditioning: [region_id, lead_day, season]
signature:
  window: 3            # half-width in grid boxes: 7x7 window (~39 deg, synoptic wavelength scale)
  dominance: 0.6       # share of MSE needed to call a phase or amplitude signature
pca:
  n_components: 8
analogues:
  k: 30
  min_analogues: 5
  memory_mode: causal_online   # analogue verified (valid_time <= query init) ; alternative: frozen
support:
  quantiles: [0.90, 0.975, 0.995]   # training distances -> NORMAL / MODERATE / WEAK / INSUFFICIENT
xgboost:
  n_estimators: 2000
  learning_rate: 0.03
  max_depth: 3
  min_child_weight: 200
  subsample: 0.8
  colsample_bytree: 0.5
  reg_lambda: 10.0
  tree_method: hist
  early_stopping_rounds: 100
  eval_metric: aucpr
evaluation:
  fixed_far: [0.05, 0.10]
  alert_far: 0.10      # product alert threshold chosen on VALIDATION to give 10% false-alarm rate
priority:
  # score = p_bust * urgency(lead) * evidence_weight + disagreement_bonus * max(0, disagreement)
  urgency_halflife_days: 5
  evidence_weight: {STRONG: 1.0, MODERATE: 0.85, WEAK: 0.7, "INSUFFICIENT HISTORICAL SUPPORT": 0.5}
  disagreement_bonus: 0.25
v2:
  # Pre-declared design changes, developed on the dev split only (FBS_SPLIT=dev, never 2022).
  # 1. The Sentinel (FULL) is the frozen-spec architecture: ONE shared gradient-boosted tree classifier
  #    on region, lead day, season and forecast-state features ("standard" learner). This is fixed and
  #    is NOT chosen by validation score.
  #    EXPERIMENTAL comparison only (never promoted to Sentinel): "residual_b2" = boost from the
  #    cross-fitted B2 log-odds margin (a stacked B2 + GBT model, not the frozen architecture).
  #    It uses the same validation-only group selection and is reported as EXP_RESIDUAL.
  learners: [standard]
  experimental_learners: [residual_b2]
  crossfit: year        # B2 margins for TRAIN rows come from leave-one-year-out B2 fits
  # 2. Feature Group B completion: wind (500/850 hPa), vorticity, divergence, shear and MSLP,
  #    from the ensemble mean/std of the same IFS ENS store (DYN group). Requires data/cache/ens_extra.
  dyn_features: true
  # 3. LOCKED 2026-09-30 from the dev-split optimisation (artifacts/v2/dev/optimization/, scripts/optimize_v2.py),
  #    before any v2 scoring of 2022. Hyper-parameters: best validation-2020 AUPRC over the same 20-config
  #    grid for B2 and the Sentinel (both chose the same values). Learner: standard (0.1816 vs residual 0.1792).
  #    Groups: kept iff the 3-seed mean AUPRC gain over B2 is > 0 on BOTH validation 2020 and dev-test 2021
  #    (transfer.json). DYN (+0.0056 on 2020, -0.0005 on 2021), ENS and PAT failed; ATM, EVO, MEM, REC passed.
  b2_xgboost: {learning_rate: 0.05, subsample: 0.8, reg_lambda: 10.0, n_estimators: 3000, max_depth: 3,
               min_child_weight: 50, colsample_bytree: 0.5}
  sentinel_xgboost: {learning_rate: 0.05, subsample: 0.8, reg_lambda: 10.0, n_estimators: 3000, max_depth: 3,
                     min_child_weight: 50, colsample_bytree: 0.5}
  sentinel_groups: [ATM, EVO, MEM, REC]
  # Disclosure carried into metrics.json: the 2022 test year was already scored once by v1.
  test_history: >-
    2022 was scored once before, by the v1 pipeline (commit be8123b; Sentinel == B2). All v2 choices
    (B2 spread/threshold ratio, DYN and tendency features, hyper-parameters, learner, feature groups)
    were made on the dev split (train 2018-19, validation 2020, dev-test 2021) and locked in this file
    before v2 scored 2022 once. No v2 decision used 2022 data, but 2022 is a second look, not an
    untouched test set.
