[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-bust-sentinel"
version = "0.1.0"
description = "AI reliability layer over medium-range NWP ensembles: regional Day 1-10 forecast-bust probability (SIH26079 research prototype)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "xarray>=2024.1",
  "zarr>=2.16",
  "gcsfs>=2024.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "quantile-forest>=1.4",
  "pyarrow>=14",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: test requires internet access to the public WeatherBench 2 bucket",
]
addopts = "-m 'not network'"
