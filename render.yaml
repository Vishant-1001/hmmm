# Render Blueprint: the demo API (web service) + the React UI (static site).
services:
  - type: web
    name: forecast-bust-sentinel-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install --no-deps .
    startCommand: python -m uvicorn forecast_bust.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: FBS_CORS_ORIGINS
        sync: false

  - type: web
    name: forecast-bust-sentinel
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
